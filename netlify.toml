[build]
  command = "npm run build"
  publish = "dist/client"

# Las funciones que leen documentos con IA (varios PDFs + Gemini) tardan más
# que el límite por defecto de 10s — se les da más tiempo específicamente.
[functions."analizar-documentos"]
  timeout = 60

[functions."resumir-documentos"]
  timeout = 60

# Subir a Drive (PDFs/imágenes en base64) también puede tardar más de 10s
# con archivos grandes — antes se cortaba a la mitad ("Unexpected end of
# JSON input" en el navegador) porque Netlify mataba la función sin avisar.
[functions."subir-documento"]
  timeout = 30
